<title>Sakura Music</title>
<style>

svg{width:24px;height:24px;display:block}

.sec{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:24px 0 8px}

.row.tile>img{width:56px;height:56px;border-radius:0}
.row.tile b{flex:1;padding:0 10px;font-size:13px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.item{display:flex;align-items:center;gap:12px;padding:6px 0;cursor:pointer;border-radius:8px}
.item:active{background:rgba(255,255,255,.05)}
.cov{width:56px;height:56px;border-radius:5px;display:grid;place-items:center;background:var(--surf2);color:var(--soft);flex:none}

.msg{padding:18px;border-radius:12px;background:var(--surf);color:var(--soft);line-height:1.45;margin-bottom:10px;font-size:14px}
.empty{text-align:center;color:var(--soft);padding:40px 20px;font-size:14px;line-height:1.5}

.gcard::after{content:"";position:absolute;right:-18px;bottom:-18px;width:64px;height:64px;border-radius:12px;background:rgba(0,0,0,.2);transform:rotate(25deg)}

#full{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;overflow:hidden}
#full.on{display:block}

.fbar{display:flex;align-items:center;justify-content:space-between;height:48px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}

.fbar i{width:32px}

.fmeta p{margin:3px 0 0;color:var(--soft);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#fl.on{color:var(--acc)}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;margin:22px 0 8px;outline:none;background:linear-gradient(to right,#fff var(--p,0%),rgba(255,255,255,.22) var(--p,0%))}

.tm{display:flex;justify-content:space-between;color:var(--soft);font-size:12px;font-variant-numeric:tabular-nums}

.ctl .p svg{width:34px;height:34px}
.ctl .sm svg{width:24px;height:24px;color:var(--soft)}
.ctl .sp{width:52px}

async function apiI(p){
  var base="https://itunes.apple.com/search?media=music&entity=song&limit=";
  var map=function(r){return{id:"i"+r.trackId,name:r.trackName,artist:r.artistName,img:(r.artworkUrl100||"").replace("100x100","600x600"),url:r.previewUrl,year:(r.releaseDate||"").slice(0,4),preview:true}};
  var one=async function(term,country,limit,extra){var j=await (await fetch(base+limit+"&country="+country+"&term="+encodeURIComponent(term)+(extra||""))).json();return (j.results||[]).filter(function(r){return r.previewUrl&&r.trackName}).map(map)};
  var uniq=function(a){var seen={};return a.filter(function(t){var k=t.name.toLowerCase()+"|"+(t.artist||"").toLowerCase();if(seen[t.id]||seen[k])return false;seen[t.id]=seen[k]=1;return true})};
  var none=function(){return[]};
  if(p.search){var r=await Promise.all([one(p.search,"US",30).catch(none),one(p.search,"RU",30).catch(none)]);return uniq(r[0].concat(r[1]))}
  var era=p.era;
  if(!era){
    try{
      var c=await (await fetch("https://rss.applemarketingtools.com/api/v2/us/music/most-played/50/songs.json")).json();
      var ids=c.feed.results.map(function(x){return x.id}).join(",");
      var j=await (await fetch("https://itunes.apple.com/lookup?entity=song&id="+ids)).json();
      var t=uniq((j.results||[]).filter(function(r){return r.previewUrl&&r.trackName}).map(map));
      if(t.length)return t;
    }catch(e){}
    era="20";
  }
  var cfg=ERA_CFG[era];
  var all=await Promise.all(cfg.a.map(function(a){return one(a,"US",14,"&attribute=artistTerm").catch(none)}));
  var inEra=all.map(function(l){return l.filter(function(t){var y=+t.year;return y>=cfg.y[0]&&y<=cfg.y[1]})});
  var use=inEra.reduce(function(n,l){return n+l.length},0)>=8?inEra:all;
  var out=[];for(var i=0;i<6;i++)use.forEach(function(l){if(l[i])out.push(l[i])});
  return uniq(out);
}
function isLiked(t){return liked.some(function(x){return x.id==t.id})}
function greet(){var h=new Date().getHours();return h<5?"Доброй ночи":h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер"}
function byline(t){return esc(t.artist)+(t.year?" • "+esc(t.year):"")}

function tile(t,i){var n=queue[qi]&&queue[qi].id==t.id;

      +'<div class="item" data-a="open" data-n="__liked"><div class="cov liked">'+I.heart(true)+'</div><div class="meta"><b>Любимое</b><span>Плейлист • '+pl(liked.length)+'</span></div></div>'
      +Object.keys(lists).map(function(n){return '<div class="item" data-a="open" data-n="'+esc(n)+'"><div class="cov">'+I.note+'</div><div class="meta"><b>'+esc(n)+'</b><span>Плейлист • '+pl(lists[n].length)+'</span></div></div>'}).join("")
      +(local.length?'<div class="item" data-a="open" data-n="__local"><div class="cov">'+I.folder+'</div><div class="meta"><b>Файлы с телефона</b><span>Сохранено на телефоне • '+pl(local.length)+'</span></div></div>':'')
      +'<div class="item" data-a="new"><div class="cov dash">'+I.plus+'</div><div class="meta"><b>Новый плейлист</b></div></div>'
      +'<div class="item" data-a="pick"><div class="cov dash">'+I.folder+'</div><div class="meta"><b>Добавить файлы с телефона</b></div></div>';
  }
}
function toggleLike(t,btn){
  if(isLiked(t))liked=liked.filter(function(x){return x.id!=t.id});else liked.push(t);
  save("liked",liked);if(btn){var l=isLiked(t);btn.innerHTML=I.heart(l);btn.classList.toggle("on",l)}paint();
}
function addSheet(t){
  var s=$("#sheet");

$("#view").onclick=function(e){
  var g=e.target.closest("[data-g]");if(g){genre=g.dataset.g;go();return}

    else if(x==="pick")$("#pick").click();
    else if(x==="open"){var n=a.dataset.n;sub=n==="__local"?{title:"Файлы с телефона",tracks:local,n:n}:n==="__liked"?{title:"Любимое",tracks:liked,n:n}:{title:n,tracks:lists[n],n:n};go()}

$("#view").addEventListener("keydown",function(e){if(e.target.id==="q"&&e.key==="Enter"){q=e.target.value.trim();go()}});
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;sub=null;setupOpen=false;go()}});

/* local files: stored on the phone (IndexedDB), survive restarts */
var dbp=new Promise(function(res,rej){var r=indexedDB.open("sakura-music",1);r.onupgradeneeded=function(){r.result.createObjectStore("files",{keyPath:"id"})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}});
function idb(mode,fn){return dbp.then(function(db){return new Promise(function(res,rej){var t=db.transaction("files",mode),rq=fn(t.objectStore("files"));t.oncomplete=function(){res(rq&&rq.result)};t.onerror=function(){rej(t.error)}})})}
function idbAll(){return idb("readonly",function(st){return st.getAll()})}
function idbPut(r){return idb("readwrite",function(st){return st.put(r)})}
function idbDel(id){return idb("readwrite",function(st){return st.delete(id)})}
function delTrack(i){var t=shown[i];if(!t||!sub)return;
  if(sub.n==="__local"){idbDel(t.id).catch(function(){});local=local.filter(function(x){return x.id!==t.id});sub.tracks=local;
    liked=liked.filter(function(x){return x.id!==t.id});save("liked",liked);
    Object.keys(lists).forEach(function(n){lists[n]=lists[n].filter(function(x){return x.id!==t.id})});save("lists",lists)}
  else if(lists[sub.n]){lists[sub.n]=lists[sub.n].filter(function(x){return x.id!==t.id});sub.tracks=lists[sub.n];save("lists",lists)}
  go()}
$("#pick").onchange=function(){
  var files=Array.prototype.slice.call(this.files),inp=this,stamp=Date.now();

    local.push({id:rec.id,name:rec.name,artist:"Мой телефон",img:"",url:URL.createObjectURL(f)});
    return idbPut(rec).catch(function(){})
  })).then(function(){inp.value="";tab="lib";sub={title:"Файлы с телефона",tracks:local,n:"__local"};go()})};
function fixLocal(arr){return arr.map(function(t){if(String(t.id).charAt(0)!=="l")return t;return local.filter(function(x){return x.id===t.id})[0]||null}).filter(Boolean)}
idbAll().then(function(rows){
  local=(rows||[]).map(function(r){return{id:r.id,name:r.name,artist:"Мой телефон",img:"",url:URL.createObjectURL(r.blob)}});
  liked=fixLocal(liked);Object.keys(lists).forEach(function(n){lists[n]=fixLocal(lists[n])});
  if(tab==="lib"&&!sub)go()}).catch(function(){});

/* player */
async function play(i){qi=i;var t=queue[qi];if(!t)return;paint();
  if(!t.url&&t.arch){au.pause();try{t.url=await resolveArch(t.arch)}catch(e){}
    if(queue[qi]!==t)return;
    if(!t.url){setTimeout(function(){if(queue[qi]===t)step(1)},400);return}}
  au.src=t.url;au.play().catch(function(){});
  try{navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist||"",artwork:t.img?[{src:t.img,sizes:"300x300"}]:[]})}catch(e){}}
function step(d){if(queue.length)play((qi+d+queue.length)%queue.length)}
function prev(){if(au.currentTime>3)au.currentTime=0;else step(-1)}
function toggle(){if(au.src){au.paused?au.play():au.pause()}}

  var t=queue[qi];if(!t)return;
  $("#mini").hidden=false;
  $("#mini>img").src=t.img||PH;$("#mini b").textContent=t.name;$("#mini span").textContent=t.artist||"";

  var l=isLiked(t);$("#fl").innerHTML=I.heart(l);$("#fl").classList.toggle("on",l);$("#pnote").hidden=!t.preview;
  document.querySelectorAll(".row").forEach(function(el){var s=shown[el.dataset.i];el.classList.toggle("now",!!s&&s.id==t.id)});

}
function icons(){var s=au.paused?I.play:I.pause;$("#mp").innerHTML=s;$("#fpl").innerHTML=s;playing=!au.paused}
var playing=false;
function setP(el,p){el.style.setProperty("--p",p+"%")}

try{navigator.mediaSession.setActionHandler("nexttrack",function(){step(1)});navigator.mediaSession.setActionHandler("previoustrack",prev);navigator.mediaSession.setActionHandler("play",toggle);navigator.mediaSession.setActionHandler("pause",toggle)}catch(e){}
$("#fx").innerHTML=I.down;$("#fp").innerHTML=I.prev;$("#fn").innerHTML=I.next;$("#fa").innerHTML=I.plus;$("#fl").innerHTML=I.heart(false);icons();

/* sakura petals: tiny, slow, behind the content */
var pc=$("#petals"),px=pc.getContext("2d"),W,H,P=[],dpr=Math.min(devicePixelRatio||1,2),slow=matchMedia("(prefers-reduced-motion:reduce)").matches?.3:1;
function rs(){W=innerWidth;H=innerHeight;pc.width=W*dpr;pc.height=H*dpr;px.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",rs);rs();
function mk(y){return{x:Math.random()*W,y:y==null?Math.random()*H:y,s:4+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.025,vy:(.3+Math.random()*.5)*slow,ph:Math.random()*6.28,a:.1+Math.random()*.2}}
for(var i=0;i<14;i++)P.push(mk());
function frame(t){
  px.clearRect(0,0,W,H);px.fillStyle="#ff9ebe";
  for(var i=0;i<P.length;i++){var p=P[i];
    p.y+=p.vy;p.x+=(Math.sin(t/1600+p.ph)*.5+.2)*slow;p.r+=p.vr*slow;
    if(p.y>H+20||p.x>W+20)P[i]=p=mk(-15);
    px.save();px.translate(p.x,p.y);px.rotate(p.r);px.globalAlpha=p.a;px.beginPath();px.moveTo(0,-p.s);
    px.bezierCurveTo(p.s*.9,-p.s*.6,p.s*.7,p.s*.6,0,p.s);px.bezierCurveTo(-p.s*.7,p.s*.6,-p.s*.9,-p.s*.6,0,-p.s);px.fill();px.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
go();
})();
